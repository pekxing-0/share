<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知根底 阅卷单页与划线遥测演示</title>
<style>
  :root {
    --desk-bg: #EAEEF2;
    --sheet-bg: #FCFDFE;
    --rail-bg: #F4F6F9;
    --ink-main: #17212B;
    --ink-body: #273444;
    --ink-muted: #5F6F82;
    --ink-faint: #8C9BAE;
    --line-soft: #DCE3EC;
    --line-strong: #BCC8D6;

    --jade-ink: #0D654D;
    --jade-bg: #E1F3EC;
    --jade-line: #7BC7B0;

    --verm-ink: #A62C22;
    --verm-bg: #FBE9E7;
    --verm-line: #E09B95;

    --indigo-ink: #1F4B94;
    --indigo-bg: #E7EFFC;
    --indigo-line: #94B3E8;

    --partner-a: #6B3FA0;
    --partner-b: #9A5B13;

    --font-serif: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", "Noto Serif SC", Georgia, serif;
    --font-sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-num: "SF Pro Text", "Inter", "PingFang SC", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--desk-bg);
    color: var(--ink-main);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
  }

  button:focus-visible {
    outline: 2px solid var(--indigo-ink);
    outline-offset: 2px;
  }

  .topbar {
    background-color: #1A2430;
    color: #F2F5F8;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid #2C3A4B;
  }

  .brand-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .brand-title {
    font-size: 15px;
    font-weight: 600;
    color: #FFFFFF;
  }

  .brand-note {
    font-size: 12px;
    color: #B2C0D0;
  }

  .scen-switch {
    display: inline-flex;
    background: #253242;
    border: 1px solid #38495E;
    border-radius: 4px;
    padding: 2px;
    gap: 2px;
  }

  .scen-btn {
    padding: 4px 10px;
    font-size: 12px;
    color: #C3CFD9;
    border-radius: 3px;
  }

  .scen-btn.is-active {
    background: #FFFFFF;
    color: #17212B;
    font-weight: 600;
  }

  /* Compact sticky live-telemetry dock for narrow side-pane (<900px) */
  .compact-dock {
    display: none;
    position: sticky;
    top: 0;
    z-index: 35;
    background: #1E2B3A;
    color: #EEF3F8;
    padding: 7px 16px;
    border-bottom: 1px solid #324459;
    font-size: 12px;
  }

  .dock-metrics {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .dock-nums {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .dock-kv strong {
    font-family: var(--font-num);
    color: #7CE8C8;
    margin-left: 3px;
    font-weight: 600;
  }

  .dock-jump {
    font-size: 11.5px;
    color: #A9C7FF;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .dock-latest {
    margin-top: 4px;
    font-size: 11.5px;
    color: #C9D6E4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  @media (max-width: 900px) {
    .compact-dock { display: block; }
  }

  .desk {
    max-width: 1360px;
    margin: 0 auto;
    padding: 14px 16px 30px;
    display: grid;
    grid-template-columns: minmax(0, 1.32fr) minmax(320px, 0.88fr);
    gap: 16px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .desk { grid-template-columns: 1fr; }
  }

  .packet-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 9px;
    flex-wrap: wrap;
  }

  .packet-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .pkt-tab {
    padding: 5px 11px;
    font-size: 12.5px;
    background: #DFE6EE;
    color: var(--ink-body);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .pkt-tab.is-active {
    background: var(--sheet-bg);
    color: var(--ink-main);
    border-color: var(--ink-main);
    font-weight: 600;
  }

  .pkt-pill {
    font-size: 11px;
    padding: 0 5px;
    border-radius: 2px;
    background: var(--indigo-bg);
    color: var(--indigo-ink);
    font-weight: 500;
  }

  .pkt-pill.is-skipped {
    background: #E8ECEF;
    color: var(--ink-muted);
  }

  .paper-sheet {
    background: var(--sheet-bg);
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    box-shadow: 0 2px 8px rgba(23, 33, 43, 0.04);
    position: relative;
  }

  .sheet-toolbar {
    padding: 10px 18px;
    border-bottom: 1px solid var(--line-soft);
    background: #F7F9FB;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .sheet-origin {
    font-size: 12px;
    color: var(--ink-muted);
  }

  .sheet-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .act-btn {
    padding: 4px 9px;
    font-size: 12px;
    border-radius: 3px;
    border: 1px solid var(--line-strong);
    background: #FFFFFF;
    color: var(--ink-body);
    font-weight: 500;
  }

  .act-btn:hover { border-color: var(--ink-main); }

  .act-btn.is-on {
    background: var(--indigo-bg);
    border-color: var(--indigo-ink);
    color: var(--indigo-ink);
    font-weight: 600;
  }

  .act-btn.btn-skip:hover {
    background: var(--verm-bg);
    border-color: var(--verm-ink);
    color: var(--verm-ink);
  }

  .guide-strip {
    padding: 7px 18px;
    background: var(--indigo-bg);
    border-bottom: 1px solid var(--indigo-line);
    color: var(--indigo-ink);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .guide-demo-btn {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 3px;
    background: var(--indigo-ink);
    color: #FFFFFF;
    font-weight: 500;
  }

  .sheet-inner {
    padding: 20px 24px 26px 16px;
  }

  .cand-header {
    padding-left: 52px;
    padding-bottom: 12px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--line-soft);
  }

  .cand-name {
    font-family: var(--font-serif);
    font-size: 21px;
    font-weight: 700;
    color: var(--ink-main);
  }

  .cand-sub {
    font-size: 12.5px;
    color: var(--ink-muted);
    margin-top: 3px;
  }

  .auto-banner {
    margin: 0 0 14px 52px;
    padding: 9px 12px;
    background: var(--jade-bg);
    border-left: 3px solid var(--jade-ink);
    color: var(--jade-ink);
    font-size: 12.5px;
  }

  .skip-overlay {
    margin: 0 0 14px 52px;
    padding: 9px 12px;
    background: #F1F4F7;
    border-left: 3px solid var(--ink-muted);
    color: var(--ink-body);
    font-size: 12.5px;
  }

  .para-row {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr);
    gap: 8px;
    padding: 7px 8px 7px 0;
    border-radius: 3px;
    transition: background-color 0.18s ease;
  }

  .para-row + .para-row { margin-top: 4px; }
  .para-row.is-reading { background-color: #F3F7FC; }
  .para-row.is-skimmed .para-text { color: #7D8B9B; }

  .dwell-gutter {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    padding-top: 4px;
    padding-right: 6px;
    border-right: 2px solid var(--line-soft);
    user-select: none;
  }

  .para-row.is-reading .dwell-gutter { border-right-color: var(--indigo-ink); }
  .para-row.is-deep .dwell-gutter { border-right-color: var(--jade-ink); }

  .dwell-sec {
    font-family: var(--font-num);
    font-size: 11px;
    color: var(--ink-faint);
    line-height: 1.2;
  }

  .para-row.is-reading .dwell-sec { color: var(--indigo-ink); font-weight: 600; }
  .para-row.is-deep .dwell-sec { color: var(--jade-ink); font-weight: 600; }

  .dwell-tag {
    font-size: 10px;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .para-row.is-deep .dwell-tag { color: var(--jade-ink); }

  .para-content { max-width: 62ch; }

  .para-sec-label {
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-muted);
    margin-bottom: 2px;
    user-select: none;
  }

  .para-text {
    font-family: var(--font-serif);
    font-size: 15.5px;
    line-height: 1.78;
    color: var(--ink-main);
    cursor: text;
  }

  .para-text::selection {
    background: #CFE0FC;
    color: var(--ink-main);
  }

  mark.hl {
    padding: 1px 3px;
    border-radius: 2px;
    color: inherit;
    cursor: pointer;
  }

  mark.hl-solid { background: var(--jade-bg); border-bottom: 2px solid var(--jade-ink); }
  mark.hl-doubt { background: var(--verm-bg); border-bottom: 2px wavy var(--verm-ink); }
  mark.hl-rule { background: var(--indigo-bg); border-bottom: 2px solid var(--indigo-ink); }
  mark.hl-raw { background: #EEF3FA; border-bottom: 1.5px solid var(--indigo-ink); }

  .hl-badge {
    font-family: var(--font-sans);
    font-size: 10.5px;
    padding: 0 4px;
    margin-left: 3px;
    border-radius: 2px;
    vertical-align: middle;
    user-select: none;
    font-weight: 600;
  }

  .hl-solid .hl-badge { background: var(--jade-ink); color: #FFF; }
  .hl-doubt .hl-badge { background: var(--verm-ink); color: #FFF; }
  .hl-rule .hl-badge { background: var(--indigo-ink); color: #FFF; }
  .hl-raw .hl-badge { background: #64768C; color: #FFF; }

  .partner-notes {
    margin-top: 5px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    user-select: none;
  }

  .p-chip {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    font-family: var(--font-sans);
    font-size: 11.5px;
    padding: 2px 8px;
    border-radius: 3px;
    width: fit-content;
  }

  .p-chip-a { background: #F3ECFA; color: var(--partner-a); border-left: 2px solid var(--partner-a); }
  .p-chip-b { background: #FDF3E7; color: var(--partner-b); border-left: 2px solid var(--partner-b); }

  .pen-popover {
    position: fixed;
    z-index: 60;
    background: #17212B;
    color: #FFFFFF;
    border-radius: 4px;
    padding: 4px;
    display: none;
    align-items: center;
    gap: 3px;
    box-shadow: 0 6px 18px rgba(15, 23, 34, 0.24);
  }

  .pen-popover.is-open { display: inline-flex; }

  .pen-btn {
    padding: 5px 9px;
    font-size: 12px;
    border-radius: 3px;
    color: #F1F5F9;
    font-weight: 500;
    white-space: nowrap;
  }

  .pen-btn:hover { background: rgba(255, 255, 255, 0.14); }
  .pen-btn.pen-jade { color: #7CE8C8; }
  .pen-btn.pen-verm { color: #FFACA5; }
  .pen-btn.pen-indigo { color: #A9C7FF; }
  .pen-sep { width: 1px; height: 14px; background: #364658; }

  .agent-rail {
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: sticky;
    top: 14px;
  }

  .rail-box {
    background: var(--sheet-bg);
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    padding: 12px 14px;
  }

  .rail-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line-soft);
  }

  .rail-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-main);
  }

  .live-dot {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--jade-ink);
    font-weight: 500;
  }

  .live-dot::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--jade-ink);
  }

  .tele-strip {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    margin-bottom: 9px;
  }

  .tele-item {
    background: var(--rail-bg);
    border: 1px solid var(--line-soft);
    border-radius: 3px;
    padding: 6px 7px;
  }

  .tele-val {
    font-family: var(--font-num);
    font-size: 15.5px;
    font-weight: 600;
    color: var(--ink-main);
  }

  .tele-lbl {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 1px;
  }

  .signal-feed {
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 128px;
    overflow-y: auto;
  }

  .sig-line {
    font-size: 12px;
    color: var(--ink-body);
    padding: 4px 7px;
    background: #F7F9FB;
    border-left: 2px solid var(--line-strong);
    border-radius: 2px;
  }

  .sig-line.sig-jade { border-left-color: var(--jade-ink); background: #F2FAF7; }
  .sig-line.sig-verm { border-left-color: var(--verm-ink); background: #FDF5F4; }
  .sig-line.sig-indigo { border-left-color: var(--indigo-ink); background: #F2F6FD; }

  .taste-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .taste-item {
    font-size: 12px;
    padding: 6px 9px;
    background: var(--rail-bg);
    border-radius: 3px;
    border: 1px solid var(--line-soft);
  }

  .taste-k {
    font-weight: 600;
    color: var(--indigo-ink);
    margin-right: 6px;
  }

  .task-tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .t-tab {
    font-size: 11.5px;
    padding: 3px 8px;
    border-radius: 3px;
    background: var(--rail-bg);
    color: var(--ink-muted);
    border: 1px solid var(--line-soft);
  }

  .t-tab.is-active {
    background: var(--ink-main);
    color: #FFF;
    border-color: var(--ink-main);
    font-weight: 500;
  }

  .task-output {
    font-size: 12.5px;
    color: var(--ink-body);
    line-height: 1.6;
    background: #F8FAFC;
    border: 1px solid var(--line-soft);
    border-radius: 3px;
    padding: 9px 11px;
  }

  .task-output li {
    margin-left: 16px;
    margin-bottom: 4px;
  }

  .dual-note {
    display: grid;
    grid-template-columns: 1fr;
    gap: 7px;
  }

  .note-priv {
    padding: 7px 9px;
    background: #F3FAF7;
    border-left: 3px solid var(--jade-ink);
    font-size: 12px;
  }

  .note-pub {
    padding: 7px 9px;
    background: #F4F6F8;
    border-left: 3px solid var(--ink-muted);
    font-size: 12px;
  }

  .rail-foot {
    margin-top: 9px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .primary-send {
    background: var(--indigo-ink);
    color: #FFFFFF;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 3px;
  }

  .primary-send:hover { background: #173A75; }

  .partner-verdict {
    margin: 12px 0 0 52px;
    padding: 9px 12px;
    background: #F6F3FA;
    border: 1px solid #D2C4E8;
    border-radius: 3px;
    font-size: 12.5px;
    color: #3D235E;
  }

  @media (prefers-reduced-motion: reduce) {
    .para-row { transition: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand-row">
    <span class="brand-title">知根底 清朗阅卷单页</span>
    <span class="brand-note">不建招聘后台。人事转来简历时只展开这张干净纸页，你的停留与划线就是给随身幕僚的指令。</span>
  </div>
  <div class="scen-switch" role="tablist" aria-label="切换业务一号位视角">
    <button type="button" class="scen-btn is-active" id="btn-scen-ai" onclick="switchScen('ai')">林远（大模型推理一号位）</button>
    <button type="button" class="scen-btn" id="btn-scen-robot" onclick="switchScen('robot')">沈拓（具身控制一号位）</button>
  </div>
</header>

<div class="compact-dock" aria-live="polite">
  <div class="dock-metrics">
    <div class="dock-nums">
      <span class="dock-kv">最长驻足<strong id="d-max">0.0s</strong></span>
      <span class="dock-kv">手势划线<strong id="d-marks">0 处</strong></span>
      <span class="dock-kv">回看<strong id="d-reread">0 次</strong></span>
      <span class="dock-kv">秒关<strong id="d-skips">0 份</strong></span>
    </div>
    <button type="button" class="dock-jump" onclick="scrollToRail()">查看识人偏好与代办稿</button>
  </div>
  <div class="dock-latest" id="d-latest">正在感知阅读停留与划线手势…</div>
</div>

<main class="desk">
  <section aria-label="去噪阅卷纸">
    <div class="packet-bar">
      <div class="packet-tabs" id="packet-tabs"></div>
    </div>

    <article class="paper-sheet" id="paper-sheet">
      <div class="sheet-toolbar">
        <span class="sheet-origin" id="sheet-origin"></span>
        <div class="sheet-actions">
          <button type="button" class="act-btn" id="btn-partner" onclick="togglePartner()">拉 2 位搭档同划比对</button>
          <button type="button" class="act-btn btn-skip" id="btn-skip" onclick="quickSkip()">3 秒略过此份（记秒关）</button>
          <button type="button" class="act-btn" onclick="resetCurrent()">清空本页划线</button>
        </div>
      </div>

      <div class="guide-strip">
        <span>鼠标悬停段落自动记驻足秒数，拖选任意正文词句即可划线批注</span>
        <button type="button" class="guide-demo-btn" onclick="simulateStroke()">示范划一笔</button>
      </div>

      <div class="sheet-inner" id="sheet-inner"></div>
    </article>
  </section>

  <aside class="agent-rail" id="agent-rail" aria-label="随身人才 Agent 实时响应">
    <div class="rail-box">
      <div class="rail-head">
        <span class="rail-title">无感阅卷遥测（仅存你个人手记）</span>
        <span class="live-dot" id="live-status">实时感知中</span>
      </div>
      <div class="tele-strip">
        <div class="tele-item">
          <div class="tele-val" id="t-max">0.0s</div>
          <div class="tele-lbl">最长驻足</div>
        </div>
        <div class="tele-item">
          <div class="tele-val" id="t-marks">0 处</div>
          <div class="tele-lbl">手势划线</div>
        </div>
        <div class="tele-item">
          <div class="tele-val" id="t-reread">0 次</div>
          <div class="tele-lbl">回看重读</div>
        </div>
        <div class="tele-item">
          <div class="tele-val" id="t-skips">0 份</div>
          <div class="tele-lbl">秒关略过</div>
        </div>
      </div>
      <div class="signal-feed" id="signal-feed"></div>
    </div>

    <div class="rail-box">
      <div class="rail-head">
        <span class="rail-title">从你刚才动作里读出的识人偏好</span>
        <span style="font-size:11px;color:var(--ink-muted)" id="taste-ver">实时拟合中</span>
      </div>
      <div class="taste-list" id="taste-list"></div>
    </div>

    <div class="rail-box">
      <div class="rail-head">
        <span class="rail-title">读完即接手：已替你备好下一步</span>
      </div>
      <div class="task-tabs">

        privNote: "指端力传感器加自建标定工装，全是实打实的产线硬功夫，约本周面。",
        pubNote: "微型传感器工程化与标定经验高度匹配，请安排本周内技术一面。",
        bridge: "惜败转荐储备：与岑野形成双保险，确定录用一位后，另一位可在征得同意后转荐给同城做机械臂的老友。"
      }
    ]
  }
};

const state = {
  scen: "ai",
  candIdx: 0,
  partnerOn: false,
  taskTab: 0,
  skips: 0,
  rereads: 0,
  records: {},
  activeHover: null,
  pendingSel: null,
  popTimer: null,
  signals: []
};

function recKey(scen, idx) { return scen + "_" + idx; }

function ensureRecord(scen, idx) {
  const k = recKey(scen, idx);
  if (!state.records[k]) {
    const r = DATA[scen].resumes[idx];
    const seedMarks = (r.preMarks || []).map(m => ({...m, auto: true}));
    state.records[k] = { dwell: {}, visited: {}, marks: seedMarks, skipped: false };
  }
  return state.records[k];
}

function addSignal(text, tone) {
  const now = new Date();
  const ts = String(now.getMinutes()).padStart(2, "0") + ":" + String(now.getSeconds()).padStart(2, "0");
  state.signals.unshift({ ts, text, tone: tone || "" });
  if (state.signals.length > 14) state.signals.pop();
  const dockEl = document.getElementById("d-latest");
  if (dockEl) dockEl.textContent = "最新感知：" + text;
  renderSignals();
}

function scrollToRail() {
  const el = document.getElementById("agent-rail");
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}

function switchScen(sc) {
  state.scen = sc;
  state.candIdx = 0;
  state.partnerOn = false;
  state.taskTab = 0;
  state.signals = [];
  document.getElementById("btn-scen-ai").classList.toggle("is-active", sc === "ai");
  document.getElementById("btn-scen-robot").classList.toggle("is-active", sc === "robot");
  addSignal("已载入去噪阅卷单页，等待你自然阅读", "sig-indigo");
  renderAll();
}

function selectResume(idx) {
  state.candIdx = idx;
  hidePopover();
  const r = DATA[state.scen].resumes[idx];
  addSignal("展开《" + r.name + "》去噪单页" + (r.preMarks ? "（已套用你的偏好预划线）" : ""), "sig-indigo");
  renderAll();
}

function togglePartner() {
  state.partnerOn = !state.partnerOn;
  document.getElementById("btn-partner").classList.toggle("is-on", state.partnerOn);
  if (state.partnerOn) {
    addSignal("已叠加上两位面试搭档的 3 分钟划线，分歧点自动对齐", "sig-indigo");
  }
  renderSheet();
}

function quickSkip() {
  const rec = ensureRecord(state.scen, state.candIdx);
  if (!rec.skipped) {
    rec.skipped = true;
    state.skips += 1;
  }
  const r = DATA[state.scen].resumes[state.candIdx];
  addSignal("3 秒略过《" + r.name + "》：已记入负向样本，后续同类包装履历自动降权", "sig-verm");
  renderAll();
}

function resetCurrent() {
  const k = recKey(state.scen, state.candIdx);
  const r = DATA[state.scen].resumes[state.candIdx];
  state.records[k] = {
    dwell: {},
    visited: {},
    marks: (r.preMarks || []).map(m => ({...m, auto: true})),
    skipped: false
  };
  addSignal("已重置《" + r.name + "》本页手势记录", "");
  renderAll();
}

function escapeHTML(str) {
  return str.replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function removeMark(mIdx, ev) {
  ev.stopPropagation();
  const rec = ensureRecord(state.scen, state.candIdx);
  rec.marks.splice(mIdx, 1);
  renderAll();
}

function renderTabs() {
  const list = DATA[state.scen].resumes;
  const html = list.map((r, i) => {
    const rec = ensureRecord(state.scen, i);
    const markCount = rec.marks.length;
    let pill = r.badge;
    let pillCls = "pkt-pill";
    if (rec.skipped) {
      pill = "已秒关";
      pillCls += " is-skipped";
    } else if (markCount > 0 && !r.preMarks) {
      pill = "已划 " + markCount + " 处";
    }
    return `<button type="button" class="pkt-tab ${state.candIdx === i ? "is-active" : ""}" onclick="selectResume(${i})">
      <span>${r.name}</span>
      <span class="${pillCls}">${pill}</span>
    </button>`;
  }).join("");
  document.getElementById("packet-tabs").innerHTML = html;
}

function decorateWithGlobal(rawText, marksWithG) {
  if (!marksWithG || !marksWithG.length) return escapeHTML(rawText);
  const ranges = [];
  marksWithG.forEach(m => {
    if (!m.phrase) return;
    const pos = rawText.indexOf(m.phrase);
    if (pos === -1) return;
    const end = pos + m.phrase.length;
    if (ranges.some(x => !(end <= x.start || pos >= x.end))) return;
    ranges.push({ start: pos, end, type: m.type, auto: m.auto, gIdx: m.gIdx });
  });
  ranges.sort((a, b) => a.start - b.start);

  const labelMap = { solid: "实干", doubt: "存疑", rule: "底线", raw: "划线" };
  let out = "";
  let cur = 0;
  for (const rg of ranges) {
    out += escapeHTML(rawText.slice(cur, rg.start));
    const slice = escapeHTML(rawText.slice(rg.start, rg.end));
    const cls = "hl hl-" + (rg.type || "raw");
    const tag = (rg.auto ? "预标 " : "") + (labelMap[rg.type] || "划线");
    out += `<mark class="${cls}" title="点击移除此条划线" onclick="removeMark(${rg.gIdx}, event)">${slice}<span class="hl-badge">${tag}</span></mark>`;
    cur = rg.end;
  }
  out += escapeHTML(rawText.slice(cur));
  return out;
}

function renderSheet() {
  const scenObj = DATA[state.scen];
  const r = scenObj.resumes[state.candIdx];
  const rec = ensureRecord(state.scen, state.candIdx);

  document.getElementById("sheet-origin").textContent = r.origin;
  document.getElementById("btn-partner").classList.toggle("is-on", state.partnerOn);

  const autoHTML = r.autoBanner
    ? `<div class="auto-banner">${escapeHTML(r.autoBanner)}</div>`
    : "";

  const skipHTML = rec.skipped
    ? `<div class="skip-overlay">你已将此份简历标为「秒关略过」。它的空泛句式特征已记入防踩坑偏好，不排面试。</div>`
    : "";

  const parasHTML = r.paras.map((p, pIdx) => {
    const secVal = rec.dwell[pIdx] || 0;
    const isDeep = secVal >= 3.5;
    const isSkimmed = !isDeep && secVal > 0 && secVal < 1.5 && state.activeHover !== pIdx;
    const pMarksWithGlobal = rec.marks
      .map((m, gIdx) => ({...m, gIdx}))
      .filter(m => m.paraIdx === pIdx);

    const decorated = decorateWithGlobal(p.text, pMarksWithGlobal);

    let statusTag = "未读";
    if (isDeep) statusTag = "驻足细读";
    else if (secVal >= 1.5) statusTag = "已读";
    else if (secVal > 0) statusTag = "扫过";

    const partnerHTML = (state.partnerOn && p.partners && p.partners.length)
      ? `<div class="partner-notes">${p.partners.map(pt =>
          `<span class="p-chip ${pt.who === 'a' ? 'p-chip-a' : 'p-chip-b'}">${escapeHTML(pt.text)}</span>`
        ).join("")}</div>`
      : "";

    return `
      <div class="para-row ${state.activeHover === pIdx ? "is-reading" : ""} ${isDeep ? "is-deep" : ""} ${isSkimmed ? "is-skimmed" : ""}"
           data-pidx="${pIdx}"
           onmouseenter="enterPara(${pIdx})"
           onmouseleave="leavePara(${pIdx})">
        <div class="dwell-gutter">
          <span class="dwell-sec" id="dwell-sec-${pIdx}">${secVal.toFixed(1)}s</span>
          <span class="dwell-tag" id="dwell-tag-${pIdx}">${statusTag}</span>
        </div>
        <div class="para-content">
          <div class="para-sec-label">${escapeHTML(p.sec)}</div>
          <div class="para-text" data-pidx="${pIdx}">${decorated}</div>
          ${partnerHTML}
        </div>
      </div>
    `;
  }).join("");

  const verdictHTML = state.partnerOn
    ? `<div class="partner-verdict">${escapeHTML(r.partnerVerdict)}</div>`
    : "";

  document.getElementById("sheet-inner").innerHTML = `
    <div class="cand-header">
      <div class="cand-name">${escapeHTML(r.name)}</div>
      <div class="cand-sub">${escapeHTML(r.role)}</div>
    </div>
    ${autoHTML}
    ${skipHTML}
    ${parasHTML}
    ${verdictHTML}
  `;
}

function enterPara(pIdx) {
  const rec = ensureRecord(state.scen, state.candIdx);
  state.activeHover = pIdx;
  rec.visited[pIdx] = (rec.visited[pIdx] || 0) + 1;
  if (rec.visited[pIdx] === 2 && (rec.dwell[pIdx] || 0) >= 1.2) {
    state.rereads += 1;
    const secName = DATA[state.scen].resumes[state.candIdx].paras[pIdx].sec;
    addSignal("检测到回看重读「" + secName + "」段，权重自动上调", "sig-indigo");
  }
  const row = document.querySelector(`.para-row[data-pidx="${pIdx}"]`);
  if (row) row.classList.add("is-reading");
}

function leavePara(pIdx) {
  if (state.activeHover === pIdx) state.activeHover = null;
  const row = document.querySelector(`.para-row[data-pidx="${pIdx}"]`);
  if (row) row.classList.remove("is-reading");
}

setInterval(() => {
  if (state.activeHover === null) return;
  const pIdx = state.activeHover;
  const rec = ensureRecord(state.scen, state.candIdx);
  const prev = rec.dwell[pIdx] || 0;
  const next = +(prev + 0.1).toFixed(1);
  rec.dwell[pIdx] = next;

  const secEl = document.getElementById("dwell-sec-" + pIdx);
  const tagEl = document.getElementById("dwell-tag-" + pIdx);
  const rowEl = document.querySelector(`.para-row[data-pidx="${pIdx}"]`);
  if (secEl) secEl.textContent = next.toFixed(1) + "s";
  if (next >= 3.5 && prev < 3.5) {
    if (tagEl) tagEl.textContent = "驻足细读";
    if (rowEl) rowEl.classList.add("is-deep");
    const secName = DATA[state.scen].resumes[state.candIdx].paras[pIdx].sec;
    addSignal("在「" + secName + "」驻足满 3.5 秒，已捕获关注焦点", "sig-jade");
    renderTasteAndTasks();
  } else if (next >= 1.5 && prev < 1.5) {
    if (tagEl) tagEl.textContent = "已读";
  }
  updateTelemetryCounters();
}, 100);

document.addEventListener("mouseup", (ev) => {
  const pop = document.getElementById("pen-popover");
  if (pop.contains(ev.target)) return;

  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) {
      clearTimeout(state.popTimer);
      state.pendingSel = null;
      hidePopover();
      return;
    }
    const phrase = sel.toString().trim();
    if (phrase.length < 2) {
      hidePopover();
      return;
    }
    let node = sel.anchorNode;
    if (node && node.nodeType === 3) node = node.parentElement;
    const paraTextEl = node ? node.closest(".para-text") : null;
    if (!paraTextEl) {
      hidePopover();
      return;
    }
    const pIdx = Number(paraTextEl.getAttribute("data-pidx"));
    const rect = sel.getRangeAt(0).getBoundingClientRect();
    state.pendingSel = { pIdx, phrase };

    const top = Math.max(10, rect.top - 42);
    const left = Math.min(window.innerWidth - 290, Math.max(12, rect.left + rect.width / 2 - 135));
    pop.style.top = top + "px";
    pop.style.left = left + "px";
    pop.classList.add("is-open");

    clearTimeout(state.popTimer);
    state.popTimer = setTimeout(() => {
      if (state.pendingSel) {
        commitHighlight(state.pendingSel.pIdx, state.pendingSel.phrase, "raw");
        state.pendingSel = null;
      }
      hidePopover();
    }, 4200);
  }, 15);
});

function hidePopover() {
  clearTimeout(state.popTimer);
  document.getElementById("pen-popover").classList.remove("is-open");
}

function applyHighlight(type, ev) {
  ev.preventDefault();
  ev.stopPropagation();
  if (!state.pendingSel) return;
  const { pIdx, phrase } = state.pendingSel;
  state.pendingSel = null;
  const sel = window.getSelection();
  if (sel) sel.removeAllRanges();
  hidePopover();
  commitHighlight(pIdx, phrase, type);
}

function commitHighlight(pIdx, phrase, type) {
  const rec = ensureRecord(state.scen, state.candIdx);
  rec.marks = rec.marks.filter(m => !(m.paraIdx === pIdx && (m.phrase.includes(phrase) || phrase.includes(m.phrase))));
  rec.marks.push({ paraIdx: pIdx, phrase, type, auto: false });

  const shortTxt = phrase.length > 18 ? phrase.slice(0, 18) + "…" : phrase;
  if (type === "solid") {
    addSignal("标实干亮点：「" + shortTxt + "」，已加入面谈核实锚点", "sig-jade");
  } else if (type === "doubt") {
    addSignal("标存疑待核：「" + shortTxt + "」，面谈前 15 分钟提醒追问边界", "sig-verm");
  } else if (type === "rule") {
    addSignal("记入用人底线：「" + shortTxt + "」，后续新简历自动照此预筛", "sig-indigo");
  } else {
    addSignal("自然划线（未点按钮自动消隐）：「" + shortTxt + "」，默认计入重点关注", "sig-indigo");
  }
  renderAll();
}

function simulateStroke() {
  const r = DATA[state.scen].resumes[state.candIdx];
  const rec = ensureRecord(state.scen, state.candIdx);
  for (let i = 0; i < r.paras.length; i++) {
    const dt = r.paras[i].demoTarget;
    if (dt && !rec.marks.some(m => m.phrase === dt)) {
      rec.dwell[i] = Math.max(rec.dwell[i] || 0, 4.6);
      commitHighlight(i, dt, r.paras[i].demoType || "solid");
      return;
    }
  }
  const fallback = r.paras[0].text.slice(0, 16);
  rec.dwell[0] = Math.max(rec.dwell[0] || 0, 4.2);
  commitHighlight(0, fallback, "doubt");
}

function updateTelemetryCounters() {
  const rec = ensureRecord(state.scen, state.candIdx);
  const vals = Object.values(rec.dwell);
  const maxD = vals.length ? Math.max(...vals) : 0;
  let totalManual = 0;
  DATA[state.scen].resumes.forEach((_, idx) => {
    const rc = ensureRecord(state.scen, idx);
    totalManual += rc.marks.filter(m => !m.auto).length;
  });
  const curMarks = rec.marks.length;

  document.getElementById("t-max").textContent = maxD.toFixed(1) + "s";
  document.getElementById("t-marks").textContent = curMarks + " 处";
  document.getElementById("t-reread").textContent = state.rereads + " 次";
  document.getElementById("t-skips").textContent = state.skips + " 份";

  document.getElementById("d-max").textContent = maxD.toFixed(1) + "s";
  document.getElementById("d-marks").textContent = curMarks + " 处";
  document.getElementById("d-reread").textContent = state.rereads + " 次";
  document.getElementById("d-skips").textContent = state.skips + " 份";

  document.getElementById("taste-ver").textContent = totalManual > 0
    ? "已吸收你 " + totalManual + " 处手势校准"
    : "按过往判例初始拟合";
}

function renderSignals() {
  const box = document.getElementById("signal-feed");
  if (!state.signals.length) {
    box.innerHTML = `<div class="sig-line">等待你在左侧纸页上停留或划线…</div>`;
    return;
  }
  box.innerHTML = state.signals.map(s =>
    `<div class="sig-line ${s.tone}"><span style="color:var(--ink-faint);margin-right:6px">${s.ts}</span>${escapeHTML(s.text)}</div>`
  ).join("");
}

function renderTasteAndTasks() {
  const scenObj = DATA[state.scen];
  const r = scenObj.resumes[state.candIdx];
  const rec = ensureRecord(state.scen, state.candIdx);

  const solidMarks = rec.marks.filter(m => m.type === "solid" || m.type === "raw");
  const doubtMarks = rec.marks.filter(m => m.type === "doubt");
  const ruleMarks = rec.marks.filter(m => m.type === "rule");

  const l1Dynamic = solidMarks.length
    ? `本页你重点圈出「${solidMarks[solidMarks.length - 1].phrase.slice(0, 16)}…」，只认带数字的工程结果。`
    : scenObj.tasteBase.l1;

  const l2Dynamic = doubtMarks.length
    ? `刚标存疑「${doubtMarks[doubtMarks.length - 1].phrase.slice(0, 16)}…」，与你过往反感挂名汇报的判例一致。`
    : scenObj.tasteBase.l2;

  const l3Dynamic = ruleMarks.length
    ? `最新底线更新：「${ruleMarks[ruleMarks.length - 1].phrase.slice(0, 16)}…」已记入筛人规则，下一份自动套用。`
    : scenObj.tasteBase.l3;

  document.getElementById("taste-list").innerHTML = `
    <div class="taste-item"><span class="taste-k">关注重心</span>${escapeHTML(l1Dynamic)}</div>
    <div class="taste-item"><span class="taste-k">存疑雷区</span>${escapeHTML(l2Dynamic)}</div>
    <div class="taste-item"><span class="taste-k">放行底线</span>${escapeHTML(l3Dynamic)}</div>
    <div class="taste-item"><span class="taste-k">当下急务</span>${escapeHTML(scenObj.tasteBase.l4)}</div>
  `;

  [0, 1, 2].forEach(i => document.getElementById("tt-" + i).classList.toggle("is-active", state.taskTab === i));
  document.getElementById("handoff-btn").textContent = scenObj.hostLabel;

  const taskBox = document.getElementById("task-body");
  if (state.taskTab === 0) {
    const customProbes = [...r.probes];
    doubtMarks.filter(m => !m.auto).forEach(m => {
      customProbes.unshift(`针对你刚划的「${m.phrase.slice(0, 15)}…」追问：本人亲手做的边界在哪、验收指标怎么测的？`);
    });
    taskBox.innerHTML = `<ul class="task-output">${customProbes.slice(0, 4).map(q => `<li>${escapeHTML(q)}</li>`).join("")}</ul>`;
  } else if (state.taskTab === 1) {
    taskBox.innerHTML = `
      <div class="dual-note">
        <div class="note-priv"><strong>个人识人手记（随身带走，不进公司库）：</strong><br>${escapeHTML(r.privNote)}</div>
        <div class="note-pub"><strong>交人事归档公文（得体合规，一键回传 ATS）：</strong><br>${escapeHTML(r.pubNote)}</div>
      </div>`;
  } else {
    taskBox.innerHTML = `<div class="task-output">${escapeHTML(r.bridge)}</div>`;
  }
}

function setTaskTab(idx) {
  state.taskTab = idx;
  renderTasteAndTasks();
}

function confirmTask() {
  const btn = document.getElementById("handoff-btn");
  const hint = document.getElementById("handoff-hint");
  const r = DATA[state.scen].resumes[state.candIdx];
  btn.textContent = "已交由主助理跟进";
  hint.textContent = "面谈前 15 分钟将自动推送《" + r.name + "》备忘卡";
  addSignal("已将《" + r.name + "》后续动作交由主助理代办（日历提醒加人事回执草稿）", "sig-jade");
  setTimeout(() => {
    btn.textContent = DATA[state.scen].hostLabel;
  }, 1800);
}

function renderAll() {
  renderTabs();
  renderSheet();
  updateTelemetryCounters();
  renderSignals();
  renderTasteAndTasks();
}

addSignal("去噪阅卷单页已就绪：鼠标悬停段落计驻足时长，拖选文字即可划线", "sig-indigo");
renderAll();
</script>
