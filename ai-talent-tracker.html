*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

.stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:26px}

源/GitHub、实习经验，「双一流」第八。"},{"id":"a-campus-penetration-2026","name":"2026 年 1–5 月校招 AI 岗位渗透率","value":"新发校招岗位量同比 +3.56%，其中 AI 岗位同比 +47.3%；AI 岗位渗透率从 26.41% 抬升至 37.56%","scope":"校招 / AI 岗位结构","source":"知乎专栏（二级汇编） 2026-09-16","url":"https://zhuanlan.zhihu.com/p/2083421766240694326","note":"二级转引（自媒体二次汇编），未取到原始统计方。同篇另给：阿里员工总数从 2024 年底约 19.4 万降至 2025 年底 12.8 万；智联招聘 Q2 数据 AI 工程师岗位供需比 2.24。"},{"id":"a-embodied-band-2026","name":"具身智能算法工程师薪酬带（2026）","value":"核心城市普通具身智能算法工程师月薪约 5 万元（部分数据接近 6.3 万元）；强化学习、世界模型、运动控制方向资深人才年薪 200万–300万「并不罕见」；相关实验室应届生起薪普遍 60 万甚至 70 万元以上","scope":"具身智能 / 机器人算法","source":"钛媒体（Leo张ToB杂谈） 2026-09","url":"https://zhuanlan.zhihu.com/p/2072276846872417680","note":"一手访谈+招聘数据混用，未披露统计方法与样本量。同篇引浙江人形机器人创新中心工业应用技术总师俞鸿翔「刚毕业的学弟可能拿到 200 万到 300 万级别的 offer」——属个人口径，勿当行情。"},{"id":"a-volcano-embodied-2026","name":"字节火山引擎具身智能岗位月薪","value":"「操作算法资深专家（具身智能）」月薪 9.5万–12万元","scope":"具身智能 / 操作算法","source":"钛媒体（Leo张ToB杂谈） 2026-09","url":"https://zhuanlan.zhihu.com/p/2072276846872417680","note":"招聘页面挂出的区间口径，未注明是否含股权/奖金。可比项：同篇给三百人规模具身公司「仅人力成本一项，一年支出就会达到三亿元」。"},{"id":"a-topseed-600w-2026","name":"字节 Top Seed 部分核心岗位年薪超 600 万","value":"「字节跳动 Top Seed 部分核心岗位的年薪已超过 600 万元」","scope":"大厂顶尖应届生 / 大模型核心岗","source":"钛媒体（霞光AI实验室） 2026-09-04","url":"https://www.tmtpost.com/8127900.html","note":"原文未拆解现金/期权/奖金占比。与 2026-09 投资界口径「TopSeed/阿里星/腾讯大咖 500 万及以上年包、每家几十人」方向一致，可互为参照但不可合并计算。"},{"id":"a-zhijia-jump-2026","name":"2026 智驾 → 具身智能跳槽涨幅与 AI Infra 定价","value":"普通工程师平均涨幅 10%–30%；能力与岗位高度匹配 30%–40%；工程化/部署/商业化岗可能平薪甚至降薪；算法人才低则 30%、高则翻倍、少数达三倍；AI Infra 薪资「不设限」，有具身公司称「能对齐字节，现金加期权都能对齐」","scope":"具身智能 / AI Infra / 自动驾驶转行","source":"腾讯新闻（文丨郭瑞婵 曾兴） 2026-09-01","url":"https://news.qq.com/rain/a/20260901A00VMY00","note":"为二十余位从业者（猎头、HR、业务负责人、投资人、转型员工）访谈汇总口径，非统计抽样。同篇个案：某研发人员从深圳回流成都，年薪从 90 万降到固定薪酬 58 万、加项目奖金后约 70 万总包。"},{"id":"a-hunter-2026","name":"2026 年 AI 猎头费率、单产与回款周期","value":"常见服务费率 20%–25%；传统猎头年常见业绩 70万–100万、个人年收入通常 20万–40万；佣金分两次甚至三次支付，需候选人在职 3–6 个月甚至 1 年才结清","scope":"猎头侧 / 招聘服务","source":"澎湃新闻（转 Tech星球） 2026-09-21；钛媒体（霞光AI实验室） 2026-09-04","url":"https://www.thepaper.cn/newsDetail_forward_34101498","note":"两家独立采访口径一致。补充：份额在团队内部再分配，组长可分到 15%–35%；佣金计法有两种——按总包（含期权股票）或按纯现金。"},{"id":"a-ai-monthly-2026","name":"2026 年 AI 岗位平均月薪","value":"AI 岗位平均月薪 60,738 元，新经济行业整体平均月薪 48,189 元，高出约 26%；科锐国际称「围绕人工智能的岗位需求占公司猎头业务收入 50% 以上」","scope":"AI 全领域 / 猎头业务结构","source":"澎湃新闻（转 Tech星球，引脉脉报告与科锐国际） 2026-09-21","url":"https://www.thepaper.cn/newsDetail_forward_34101498","note":"口径冲突：与库中「2025 年 AI 新发岗位平均月薪 61,475 元」统计池不同，属不同报告，不可做同比。"},{"id":"a-meta-2b-2026","name":"Meta 为庞若鸣开出 2 亿美元年包 + 全球 AI 薪酬分层","value":"Meta 为挖走苹果基础模型团队负责人庞若鸣开出 2 亿美元年包；据 Equilar，OpenAI L5 高级工程师年总包约 82.9万–87.1 万美元，Anthropic 全公司薪酬中位数约 42万–54 万美元，全球顶尖 AI 研究员年薪可超 1000 万美元","scope":"海外顶尖 AI 人才定价 / 薪酬分层","source":"智东西 2026-02-26；36氪 2026-02-26","url":"https://m.zhidx.com/p/536431.html","note":"庞若鸣的 2 亿美元方案为 2025-07 Meta 招揽时授予，2026-02-26 因他转投 OpenAI 被重新报道，故本条月份为**报道月**、不是授予月。Equilar 数据为第三方统计，未取到原始报告。"},{"id":"a-yaoshunyu-deny-2026","name":"姚顺雨「年薪过亿」传闻被腾讯辟谣","value":"「OpenAI 前研究员姚顺雨加盟腾讯时，年薪过亿的传闻逼得腾讯紧急辟谣」","scope":"大厂 AI 一号位 / 亿元级年包","source":"起点财经（网易） 2026-10-16","url":"https://www.163.com/dy/article/L9C65PUA05563WEC.html","note":"口径修正条：库中「姚顺雨 传年薪上亿」应下调。原文只说腾讯曾紧急辟谣，未给辟谣时间、主体与原话，也未说明辟谣覆盖的是「上亿」这个数字本身还是其构成；需取腾讯官方原始回应后重新定级。"}];
const WINDOW_START = (() => { const d = new Date(); d.setMonth(d.getMonth() - 24); return d.toISOString().slice(0, 7); })();

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const REL = { deep: "● 深度", warm: "● 互动", watch: "○ 关注" };
const ymd = (d) => { const m = String(d || "").match(/(\d{4})(?:-(\d{2}))?/); return m ? m[1] + "-" + (m[2] || "00") : ""; };

let VIEW = "cards", WINDOW = true;
const F = { q: "", company: "", field: "", move: "", rel: "" };

const uniq = (k) => [...new Set(DATA.map((d) => d[k]).filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), "zh"));

function filtered() {
  return DATA.filter((d) => {
    if (WINDOW && ymd(d.moveDate) && ymd(d.moveDate) < WINDOW_START) return false;
    if (F.company && d.company !== F.company) return false;
    if (F.field && d.field !== F.field) return false;
    if (F.move && d.moveType !== F.move) return false;
    if (F.rel && d.rel !== F.rel) return false;
    if (F.q) {
      const hay = [d.name, d.en, d.company, d.org, d.role, d.prev, d.field, d.source, d.why, ...(d.tags || [])].join(" ").toLowerCase();
      if (!hay.includes(F.q.toLowerCase())) return false;
    }
    return true;
  });
}

function stats() {
  const base = DATA.filter((d) => !WINDOW || !ymd(d.moveDate) || ymd(d.moveDate) >= WINDOW_START);
  const y = new Date().getFullYear();
  const recent = base.filter((d) => String(d.moveDate || "").startsWith(String(y))).length;
  const cos = new Set(base.map((d) => d.company)).size;
  const rels = DATA.filter((d) => d.rel).length;
  $("#stats").innerHTML = [
    [base.length, WINDOW ? "窗口内人物" : "全库人物"],
    [recent, y + " 年变动"],
    [cos, "覆盖机构"],
    [rels, "已建立联系"],
  ].map(([n, t]) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`).join("");
}

function card(d) {
  return `<article class="card">
    <div class="top">
      <div class="who"><h3>${esc(d.name)}${d.en ? `<span class="en">${esc(d.en)}</span>` : ""}</h3>
        <div class="now">${esc(d.company)}${d.org && d.org !== "—" ? " · " + esc(d.org) : ""}${d.role && d.role !== "—" ? " · " + esc(d.role) : ""}</div>
      </div>
      <div class="meta">
        ${d.rel ? `<span class="rel" data-l="${esc(d.rel)}">${REL[d.rel] || ""}${d.relMonth ? " · " + esc(d.relMonth.slice(5)) + "月" : ""}</span>` : ""}
        <span class="conf" data-c="${esc(d.confidence)}"><i></i>${esc(d.confidence)}</span>
      </div>
    </div>
    ${d.prev ? `<div class="move">${d.moveType ? `<span class="mt">${esc(d.moveType)}</span>` : ""}<span>← ${esc(d.prev)}</span>${d.moveDate ? `<span class="date">${esc(d.moveDate)}</span>` : ""}</div>` : ""}
    ${d.why ? `<p class="why">${esc(d.why)}</p>` : ""}
    ${d.note ? `<p class="note">⚠ ${esc(d.note)}</p>` : ""}
    ${(d.tags || []).length ? `<div class="tags">${d.tags.map((t) => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
    <div class="src">信源：${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.source || d.url)}</a>` : esc(d.source || "—")}${d.updated ? ` ｜ 更新于 ${esc(d.updated)}` : ""}</div>
  </article>`;
}

function renderCards(list) {
  if (!list.length) return `<div class="empty">没有匹配的条目。</div>`;
  return `<div class="grid">${list.map(card).join("")}</div>`;
}

function renderTimeline(list) {
  const items = list.filter((d) => d.moveDate).slice().sort((a, b) => String(b.moveDate).localeCompare(String(a.moveDate), "zh"));
  if (!items.length) return `<div class="empty">没有带时间信息的条目。</div>`;
  const g = {};
  items.forEach((d) => { const y = (String(d.moveDate).match(/\d{4}/) || ["未标年份"])[0]; (g[y] = g[y] || []).push(d); });
  return Object.entries(g).sort((a, b) => b[0].localeCompare(a[0])).map(([y, arr]) =>
    `<div class="year">${y}</div><div class="tl">${arr.map((d) => `<div class="tl-item"><div class="d">${esc(d.moveDate)}</div><div class="b"><em>${esc(d.name)}</em>${d.moveType ? " · " + esc(d.moveType) : ""} → ${esc(d.company)}${d.rel ? ` <span class="rel" data-l="${esc(d.rel)}">${REL[d.rel]}</span>` : ""}<small>${esc(d.prev || "")} ｜ ${esc(d.confidence)} ｜ ${esc(d.source || "—")}</small></div></div>`).join("")}</div>`
  ).join("");
}

function renderAnchors() {
  if (!ANCHORS.length) return `<div class="empty">暂无锚点。</div>`;
  return ANCHORS.map((a) => `<div class="anchor"><div><h4>${esc(a.name)}</h4><div class="val">${esc(a.value)}</div><div class="scope">${esc(a.scope || "")}${a.note ? " ｜ " + esc(a.note) : ""}</div></div><div class="num">${esc(a.month || "")}<br>${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">信源</a>` : ""}</div></div>`).join("");
}

function render() {
  stats();
  const list = filtered();
  $("#view").innerHTML = VIEW === "cards" ? renderCards(list) : VIEW === "timeline" ? renderTimeline(list) : renderAnchors();
}

function fill(id, key, ph) {
  const el = $(id);
  el.innerHTML = `<option value="">${ph}</option>` + uniq(key).map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
}

fill("#f-company", "company", "全部公司");
fill("#f-field", "field", "全部方向");
fill("#f-move", "moveType", "全部变动");
$("#f-rel").innerHTML = `<option value="">全部关系</option>` + Object.entries(REL).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");

$("#q").addEventListener("input", (e) => { F.q = e.target.value.trim(); render(); });
[["#f-company", "company"], ["#f-field", "field"], ["#f-move", "move"], ["#f-rel", "rel"]].forEach(([id, k]) => {
  $(id).addEventListener("change", (e) => { F[k] = e.target.value; render(); });
});
$("#win").addEventListener("click", (e) => { WINDOW = !WINDOW; e.target.textContent = WINDOW ? "近 2 年" : "全部时间"; render(); });
document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => {
  VIEW = b.getAttribute("data-view");
  document.querySelectorAll("[data-view]").forEach((x) => x.classList.toggle("on", x === b));
  render();
}));

render();
</script>
</body>
</html>
